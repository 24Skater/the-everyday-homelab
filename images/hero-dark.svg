  <path d="M247 318V358M398 318V358M549 318V358" stroke="#334155" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11" fill="#94A3B8" text-anchor="middle">
