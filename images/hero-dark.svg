<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
<title id="t">The Everyday Homelab — front elevation, as built</title>
<desc id="d">Technical elevation drawing of an 8-unit mini rack: a 10-inch touchscreen on top, three Lenovo ThinkCentre Tiny nodes running Proxmox VE, a TP-Link 8-port switch, and three Dell OptiPlex 7050 Micro nodes for AI inference. All six runs use blue cable; only the boot colour distinguishes them — green boots on the ThinkCentre runs, white boots on the OptiPlex runs. The three OptiPlex nodes are drawn with dashed outlines because they are not yet imaged.</desc>

<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B1220"/>
    <stop offset="1" stop-color="#111C33"/>
  </linearGradient>
  <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
    <path d="M16 0V16M0 16H16" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.30"/>
  </pattern>
  <pattern id="gridMajor" width="80" height="80" patternUnits="userSpaceOnUse">
    <path d="M80 0V80M0 80H80" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.55"/>
  </pattern>
  <radialGradient id="vignette" cx="0.78" cy="0.5" r="0.62">
    <stop offset="0" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
  </radialGradient>
  <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
  </filter>
  <clipPath id="frame"><rect x="24" y="24" width="1232" height="352" rx="16"/></clipPath>
</defs>

<rect width="1280" height="400" fill="url(#paper)"/>
<g clip-path="url(#frame)">
  <rect x="24" y="24" width="1232" height="352" fill="url(#grid)"/>
  <rect x="24" y="24" width="1232" height="352" fill="url(#gridMajor)"/>
  <rect x="24" y="24" width="1232" height="352" fill="url(#vignette)"/>
</g>
<rect x="24" y="24" width="1232" height="352" rx="16" fill="none" stroke="#334155" stroke-width="1"/>

<!-- Zone A: drafting margin -->
<path d="M64 24V376M68 24V376" stroke="#334155" stroke-width="1"/>

<!-- Zone B: type block -->
<g font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">
  <text x="96" y="96" font-size="13" letter-spacing="2.6" fill="#94A3B8" textLength="556" lengthAdjust="spacingAndGlyphs">FRONT ELEVATION — AS BUILT — 8U — 6 NODES — 2 CLUSTERS</text>
</g>
<text x="96" y="162" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="54" fill="#F8FAFC" textLength="536" lengthAdjust="spacingAndGlyphs">The Everyday Homelab</text>
<rect x="96" y="180" width="72" height="3" fill="#E8B847"/>
<text x="96" y="216" font-family="Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#CBD5E1" textLength="486" lengthAdjust="spacingAndGlyphs">A 10-inch mini rack, two clusters, documented as I build it.</text>
<text x="96" y="240" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" fill="#94A3B8" textLength="520" lengthAdjust="spacingAndGlyphs">3x PROXMOX VE + HA  ·  3x BARE-METAL k3s + OLLAMA  ·  NO GPU</text>

<!-- Legend -->
<g font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" fill="#CBD5E1">
  <circle cx="102" cy="282" r="5" fill="#34D399"/><text x="116" y="286">RACKED + POWERED</text>
  <circle cx="268" cy="282" r="5" fill="#F59E0B"/><text x="282" y="286">CONFIG PENDING</text>
  <circle cx="420" cy="282" r="5" fill="#94A3B8"/><text x="434" y="286">NOT YET IMAGED</text>
</g>

<!-- Title block -->
<g>
