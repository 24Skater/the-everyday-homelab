<title id="t">Build progress by workstream</title>
<desc id="d">Eight workstreams. Complete: rack and node mounting, power and PDU wiring, network cabling, Proxmox VE install, and AI node hardware. Not started: Proxmox cluster and HA, AI node OS imaging, k3s and Ollama deployment, and the wireless access point. Overall 63 percent.</desc>
