<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
<title id="t">Gear board — the seven parts that make up the rack</title>
<desc id="d">Line drawings of seven components: the GeeekPi 8U ten-inch cabinet, a 1U mini-PC shelf with front RJ45 and HDMI pass-through, an Anker Nano 65W GaN charger, an HMTECH 10.1 inch touchscreen, an ElecVoztile 1U eight-outlet PDU, a USB-C to Lenovo slim tip cable, and a USB-C to 4.5 by 3.0 millimetre barrel cable.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#111C33"/>
  </linearGradient>
  <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
    <path d="M16 0V16M0 16H16" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.30"/>
  </pattern>
  <clipPath id="frame"><rect x="16" y="16" width="928" height="488" rx="16"/></clipPath>
</defs>
<rect width="960" height="520" fill="url(#paper)"/>
<g clip-path="url(#frame)"><rect x="16" y="16" width="928" height="488" fill="url(#grid)"/></g>
<rect x="16" y="16" width="928" height="488" rx="16" fill="none" stroke="#334155" stroke-width="1"/>

<text x="38" y="58" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="26" fill="#F8FAFC">Gear board</text>
<text x="38" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#CBD5E1">SEVEN PARTS — DRAWN, NOT PHOTOGRAPHED</text>
<rect x="38" y="88" width="60" height="3" fill="#E8B847"/>

<g fill="none" stroke="#CBD5E1" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">

  <!-- 1. GeeekPi 8U cabinet -->
  <rect x="112" y="112" width="64" height="102" rx="5"/>
  <path d="M112 126h64M112 140h64M112 154h64M112 168h64M112 182h64M112 196h64"/>
  <rect x="112" y="112" width="9" height="102" fill="#1A2740"/>
  <rect x="167" y="112" width="9" height="102" fill="#1A2740"/>
  <path d="M116 119h1M116 133h1M116 147h1M116 161h1M116 175h1M116 189h1M116 203h1"/>
  <path d="M120 218v6M168 218v6"/>

  <!-- 2. 1U shelf with front pass-through -->
  <path d="M320 152h108a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H320a4 4 0 0 1-4-4v-22a4 4 0 0 1 4-4Z"/>
  <rect x="330" y="160" width="16" height="12" rx="2"/>
  <rect x="354" y="160" width="20" height="12" rx="2"/>
  <path d="M316 182l-10 14h136l-10-14"/>
  <path d="M338 160v-6M362 160v-6" stroke="#E8B847"/>

  <!-- 3. Anker Nano 65W GaN -->
  <rect x="576" y="132" width="58" height="58" rx="12"/>
  <rect x="594" y="184" width="22" height="7" rx="3.5" fill="#CBD5E1"/>
  <path d="M592 132v-12M618 132v-12"/>
  <path d="M588 120h8M614 120h8"/>
  <path d="M584 150h14M584 160h14" stroke="#94A3B8" stroke-width="1.25"/>

  <!-- 4. HMTECH 10.1in touchscreen -->
  <rect x="782" y="126" width="104" height="66" rx="5"/>
  <rect x="790" y="134" width="88" height="46" rx="2" fill="#1A2740"/>
  <path d="M826 192v10M810 202h32"/>
  <path d="M886 146h8" stroke="#E8B847"/>

  <!-- 5. ElecVoztile 1U PDU, 8 outlets -->
  <rect x="74" y="340" width="142" height="30" rx="5"/>
  <g fill="#1A2740">
    <circle cx="94" cy="355" r="5"/><circle cx="110" cy="355" r="5"/><circle cx="126" cy="355" r="5"/><circle cx="142" cy="355" r="5"/>
    <circle cx="158" cy="355" r="5"/><circle cx="174" cy="355" r="5"/><circle cx="190" cy="355" r="5"/>
  </g>
  <rect x="200" y="349" width="12" height="12" rx="2" stroke="#F59E0B"/>
  <path d="M74 348l-12-6M74 362l-12 6"/>

  <!-- 6. USB-C to Lenovo slim tip -->
  <rect x="300" y="348" width="26" height="13" rx="6.5"/>
  <path d="M326 354.5c30 0 30 14 60 14s30-14 56-14" />
  <rect x="442" y="345" width="16" height="19" rx="3" fill="#60A5FA" stroke="#CBD5E1"/>
  <path d="M446 350v9" stroke="#1A2740" stroke-width="1.5"/>

  <!-- 7. USB-C to 4.5 x 3.0mm barrel -->
  <rect x="530" y="348" width="26" height="13" rx="6.5"/>
  <path d="M556 354.5c30 0 30 14 60 14s30-14 56-14"/>
  <circle cx="680" cy="354.5" r="9" fill="#E8B847" stroke="#CBD5E1"/>
  <circle cx="680" cy="354.5" r="3" fill="#0B1220" stroke="none"/>
</g>

<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
  <g font-size="11" fill="#CBD5E1">
    <text x="144" y="248">GEEEKPI 8U CABINET</text>
    <text x="374" y="248">1U MINI-PC SHELF</text>
    <text x="604" y="248">ANKER NANO 65W</text>
    <text x="834" y="248">HMTECH 10.1&quot; TOUCH</text>
    <text x="144" y="404">ELECVOZTILE PDU</text>
    <text x="374" y="404">USB-C TO SLIM TIP</text>
    <text x="604" y="404">USB-C TO BARREL</text>
  </g>
  <g font-size="9" fill="#94A3B8">
    <text x="144" y="264">10 IN — 260 MM DEEP — x1</text>
    <text x="374" y="264">FRONT RJ45 + HDMI — x6</text>
    <text x="604" y="264">GAN II PPS — x6</text>
    <text x="834" y="264">1024x600 IPS HDMI — x1</text>
    <text x="144" y="420">1U — 8 OUTLETS — 15A</text>
    <text x="374" y="420">100W PD — LENOVO — x3</text>
    <text x="604" y="420">100W PD — 4.5x3.0 — x3</text>
  </g>
</g>

<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#94A3B8">
  <text x="728" y="404">Every node draws from one</text>
  <text x="728" y="420">charger model. Only the tip</text>
  <text x="728" y="436">changes between the two.</text>
  <path d="M728 380h180" stroke="#E8B847" stroke-width="2" fill="none"/>
</g>
<text x="38" y="484" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#94A3B8">Illustrations drawn for this repo — not manufacturer photography. Dimensions indicative, not to scale.</text>
</svg>
