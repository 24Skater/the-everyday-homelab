<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
<title id="t">Physical network topology</title>
<desc id="d">Three Lenovo ThinkCentre Tiny nodes on the left connect to a central TP-Link 8-port switch; three Dell OptiPlex 7050 Micro nodes on the right connect to the same switch. All six runs use blue cable, distinguished only by boot colour: green boots on the ThinkCentre runs, white boots on the OptiPlex runs. The switch uplinks to the LAN router; its SFP fiber port is unused. Whether the two clusters get separate VLANs or share a flat subnet is still undecided.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#111C33"/>
  </linearGradient>
  <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
    <path d="M16 0V16M0 16H16" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-opacity="0.30"/>
  </pattern>
  <clipPath id="frame"><rect x="16" y="16" width="928" height="388" rx="16"/></clipPath>
</defs>
<rect width="960" height="420" fill="url(#paper)"/>
<g clip-path="url(#frame)"><rect x="16" y="16" width="928" height="388" fill="url(#grid)"/></g>
<rect x="16" y="16" width="928" height="388" rx="16" fill="none" stroke="#334155" stroke-width="1"/>

<text x="40" y="58" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="26" fill="#F8FAFC">Physical network</text>
<text x="40" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#CBD5E1">SIX HAND-MADE RUNS — ONE SWITCH — 1 GbE THROUGHOUT</text>

<!-- Cable runs: blue jackets, as in the photo -->
<g fill="none" stroke-linecap="round">
  <path d="M246 146C316 146 316 190 386 190" stroke="#7C9BC4" stroke-width="3"/>
  <path d="M246 216C316 216 316 230 386 230" stroke="#7C9BC4" stroke-width="3"/>
  <path d="M246 286C316 286 316 270 386 270" stroke="#7C9BC4" stroke-width="3"/>
  <path d="M576 190C646 190 646 146 716 146" stroke="#7C9BC4" stroke-width="3"/>
  <path d="M576 230C646 230 646 216 716 216" stroke="#7C9BC4" stroke-width="3"/>
  <path d="M576 270C646 270 646 286 716 286" stroke="#7C9BC4" stroke-width="3"/>
  <path d="M481 300V334" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
</g>
<!-- Boots: the only labelling scheme on the whole rack -->
<g>
  <rect x="246" y="142.5" width="16" height="7" rx="3.5" fill="#34D399"/>
  <rect x="246" y="212.5" width="16" height="7" rx="3.5" fill="#34D399"/>
  <rect x="246" y="282.5" width="16" height="7" rx="3.5" fill="#34D399"/>
  <rect x="370" y="186.5" width="16" height="7" rx="3.5" fill="#34D399"/>
  <rect x="370" y="226.5" width="16" height="7" rx="3.5" fill="#34D399"/>
  <rect x="370" y="266.5" width="16" height="7" rx="3.5" fill="#34D399"/>
  <g fill="#E2E8F0" stroke="#94A3B8" stroke-width="1">
    <rect x="576" y="186.5" width="16" height="7" rx="3.5"/>
    <rect x="576" y="226.5" width="16" height="7" rx="3.5"/>
    <rect x="576" y="266.5" width="16" height="7" rx="3.5"/>
    <rect x="700" y="142.5" width="16" height="7" rx="3.5"/>
    <rect x="700" y="212.5" width="16" height="7" rx="3.5"/>
    <rect x="700" y="282.5" width="16" height="7" rx="3.5"/>
  </g>
</g>

<!-- ThinkCentre column -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="56" y="120" width="190" height="52" rx="10" fill="#1E2F4A" stroke="#475569" stroke-width="1.5"/>
  <rect x="56" y="120" width="5" height="52" rx="2.5" fill="#60A5FA"/>
  <text x="74" y="145" font-size="13" fill="#F8FAFC">TC1</text>
  <text x="74" y="161" font-size="10" fill="#CBD5E1">THINKCENTRE — PROXMOX VE</text>
  <rect x="56" y="190" width="190" height="52" rx="10" fill="#1E2F4A" stroke="#475569" stroke-width="1.5"/>
  <rect x="56" y="190" width="5" height="52" rx="2.5" fill="#60A5FA"/>
  <text x="74" y="215" font-size="13" fill="#F8FAFC">TC2</text>
  <text x="74" y="231" font-size="10" fill="#CBD5E1">THINKCENTRE — PROXMOX VE</text>
  <rect x="56" y="260" width="190" height="52" rx="10" fill="#1E2F4A" stroke="#475569" stroke-width="1.5"/>
  <rect x="56" y="260" width="5" height="52" rx="2.5" fill="#60A5FA"/>
  <text x="74" y="285" font-size="13" fill="#F8FAFC">TC3</text>
  <text x="74" y="301" font-size="10" fill="#CBD5E1">THINKCENTRE — PROXMOX VE</text>
</g>

<!-- Switch -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="386" y="160" width="190" height="140" rx="10" fill="#1E2F4A" stroke="#475569" stroke-width="2"/>
  <rect x="386" y="160" width="190" height="5" rx="2.5" fill="#475569"/>
  <text x="481" y="200" text-anchor="middle" font-size="13" fill="#F8FAFC">TP-LINK 8-PORT</text>
  <text x="481" y="218" text-anchor="middle" font-size="10" fill="#CBD5E1">3 UPLINK — 1x SFP FIBER</text>
  <g>
    <rect x="418" y="240" width="11" height="8" rx="1.5" fill="#34D399"/>
    <rect x="433" y="240" width="11" height="8" rx="1.5" fill="#34D399"/>
    <rect x="448" y="240" width="11" height="8" rx="1.5" fill="#34D399"/>
    <rect x="463" y="240" width="11" height="8" rx="1.5" fill="#E2E8F0" stroke="#475569" stroke-width="1"/>
    <rect x="478" y="240" width="11" height="8" rx="1.5" fill="#E2E8F0" stroke="#475569" stroke-width="1"/>
    <rect x="493" y="240" width="11" height="8" rx="1.5" fill="#E2E8F0" stroke="#475569" stroke-width="1"/>
    <rect x="508" y="240" width="11" height="8" rx="1.5" fill="#334155"/>
    <rect x="523" y="240" width="11" height="8" rx="1.5" fill="none" stroke="#475569" stroke-width="1"/>
    <path d="M523 248l11-8" stroke="#475569" stroke-width="1"/>
  </g>
  <text x="481" y="270" text-anchor="middle" font-size="9" letter-spacing="1" fill="#CBD5E1" textLength="150" lengthAdjust="spacingAndGlyphs">3 GREEN + 3 WHITE PATCHED</text>
  <text x="481" y="284" text-anchor="middle" font-size="9" letter-spacing="1" fill="#94A3B8" textLength="126" lengthAdjust="spacingAndGlyphs">UPLINKS + SFP UNUSED</text>
</g>

<!-- OptiPlex column -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="716" y="120" width="190" height="52" rx="10" fill="#1E2F4A" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="716" y="120" width="5" height="52" rx="2.5" fill="#E8B847"/>
  <text x="734" y="145" font-size="13" fill="#F8FAFC">AI1</text>
  <text x="734" y="161" font-size="10" fill="#CBD5E1">OPTIPLEX 7050 — NO OS YET</text>
  <rect x="716" y="190" width="190" height="52" rx="10" fill="#1E2F4A" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="716" y="190" width="5" height="52" rx="2.5" fill="#E8B847"/>
  <text x="734" y="215" font-size="13" fill="#F8FAFC">AI2</text>
  <text x="734" y="231" font-size="10" fill="#CBD5E1">OPTIPLEX 7050 — RMA REPLACED</text>
  <rect x="716" y="260" width="190" height="52" rx="10" fill="#1E2F4A" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="716" y="260" width="5" height="52" rx="2.5" fill="#E8B847"/>
  <text x="734" y="285" font-size="13" fill="#F8FAFC">AI3</text>
  <text x="734" y="301" font-size="10" fill="#CBD5E1">OPTIPLEX 7050 — NO OS YET</text>
</g>

<!-- Annotations -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1">
  <text x="316" y="330" text-anchor="middle" fill="#34D399">3x GREEN BOOT</text>
  <text x="646" y="330" text-anchor="middle" fill="#CBD5E1">3x WHITE BOOT</text>
  <text x="481" y="352" text-anchor="middle" fill="#CBD5E1">UPLINK — LAN / ROUTER</text>
</g>
<g>
  <rect x="40" y="344" width="250" height="44" rx="8" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="56" y="364" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1" fill="#F59E0B">UNDECIDED</text>
  <text x="56" y="379" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#CBD5E1">VLAN split, or one flat subnet?</text>
</g>
</svg>
