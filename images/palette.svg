<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="392" viewBox="0 0 960 392" role="img" aria-labelledby="t d">
<title id="t">Colour system</title>
<desc id="d">Fourteen colour swatches in two rows. Core: navy 1B2A41, ink 0B1220, gold E8B847, blue 2563EB, emerald 16A34A, amber F59E0B, red DC2626. Neutrals and surfaces: slate 334155, muted 64748B, border E2E8F0, surface FFFFFF, parchment FAF7F2, dark surface 1E2F4A, dark subtle 1A2740.</desc>
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#16233C"/>
  </linearGradient>
  <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
    <path d="M16 0V16M0 16H16" fill="none" stroke="#94A3B8" stroke-width="1" stroke-opacity="0.07"/>
  </pattern>
</defs>
<rect width="960" height="392" rx="16" fill="url(#card)"/>
<rect width="960" height="392" rx="16" fill="url(#grid)"/>
<rect x="0.5" y="0.5" width="959" height="391" rx="16" fill="none" stroke="#334155" stroke-width="1"/>

<text x="40" y="58" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="26" fill="#F8FAFC">Colour system</text>
<text x="40" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#94A3B8">ADAPTED FROM STEWARD-BRAND DTCG TOKENS</text>
<rect x="40" y="90" width="72" height="3" fill="#E8B847"/>

<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <text x="40" y="122" font-size="10" letter-spacing="1.8" fill="#94A3B8">CORE</text>
  <g stroke="#F8FAFC" stroke-opacity="0.18" stroke-width="1">
    <rect x="40"  y="132" width="118" height="56" rx="10" fill="#1B2A41"/>
    <rect x="170" y="132" width="118" height="56" rx="10" fill="#0B1220"/>
    <rect x="300" y="132" width="118" height="56" rx="10" fill="#E8B847"/>
    <rect x="430" y="132" width="118" height="56" rx="10" fill="#2563EB"/>
    <rect x="560" y="132" width="118" height="56" rx="10" fill="#16A34A"/>
    <rect x="690" y="132" width="118" height="56" rx="10" fill="#F59E0B"/>
    <rect x="820" y="132" width="118" height="56" rx="10" fill="#DC2626"/>
  </g>
  <g font-size="12" fill="#E2E8F0">
    <text x="40" y="206">#1B2A41</text><text x="170" y="206">#0B1220</text><text x="300" y="206">#E8B847</text><text x="430" y="206">#2563EB</text>
    <text x="560" y="206">#16A34A</text><text x="690" y="206">#F59E0B</text><text x="820" y="206">#DC2626</text>
  </g>
  <g font-size="10" letter-spacing="1.2" fill="#94A3B8">
    <text x="40" y="221">NAVY</text><text x="170" y="221">INK</text><text x="300" y="221">GOLD</text><text x="430" y="221">BLUE</text>
    <text x="560" y="221">EMERALD</text><text x="690" y="221">AMBER</text><text x="820" y="221">RED</text>
  </g>

  <text x="40" y="256" font-size="10" letter-spacing="1.8" fill="#94A3B8">NEUTRALS + SURFACES</text>
  <g stroke="#F8FAFC" stroke-opacity="0.18" stroke-width="1">
    <rect x="40"  y="266" width="118" height="56" rx="10" fill="#334155"/>
    <rect x="170" y="266" width="118" height="56" rx="10" fill="#64748B"/>
    <rect x="300" y="266" width="118" height="56" rx="10" fill="#E2E8F0"/>
    <rect x="430" y="266" width="118" height="56" rx="10" fill="#FFFFFF"/>
    <rect x="560" y="266" width="118" height="56" rx="10" fill="#FAF7F2"/>
    <rect x="690" y="266" width="118" height="56" rx="10" fill="#1E2F4A"/>
    <rect x="820" y="266" width="118" height="56" rx="10" fill="#1A2740"/>
  </g>
  <g font-size="12" fill="#E2E8F0">
    <text x="40" y="340">#334155</text><text x="170" y="340">#64748B</text><text x="300" y="340">#E2E8F0</text><text x="430" y="340">#FFFFFF</text>
    <text x="560" y="340">#FAF7F2</text><text x="690" y="340">#1E2F4A</text><text x="820" y="340">#1A2740</text>
  </g>
  <g font-size="10" letter-spacing="1.2" fill="#94A3B8">
    <text x="40" y="355">SLATE</text><text x="170" y="355">MUTED</text><text x="300" y="355">BORDER</text><text x="430" y="355">SURFACE</text>
    <text x="560" y="355">PARCHMENT</text><text x="690" y="355">DK SURFACE</text><text x="820" y="355">DK SUBTLE</text>
  </g>
</g>
<text x="40" y="378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748B">Gold is a surface colour, never text — it lands at 1.77:1 on parchment. Status meaning lives in shape and position, not hue alone.</text>
</svg>
